name: Build Null Rat Rose for Quest

on:
  push:
    branches:
      - rose-nullrats
    paths:
      - "NullRatRose/**"
      - ".github/workflows/build-null-rat-rose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package Quest mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore NuGet dependencies
        run: dotnet restore NullRatRose/NullRatRose.csproj

      - name: Download BoneLib reference assembly
        shell: bash
        run: |
          mkdir -p NullRatRose/refs /tmp/bonelib-ref
          curl -fsSL --retry 3 "https://thunderstore.io/package/download/bonelib/BoneLib/3.2.2/" -o /tmp/bonelib.zip
          unzip -q /tmp/bonelib.zip -d /tmp/bonelib-ref
          BONELIB_DLL="$(find /tmp/bonelib-ref -type f -iname 'BoneLib.dll' -print -quit)"
          if [ -z "$BONELIB_DLL" ]; then
            echo "::error::BoneLib.dll was not found in the downloaded BoneLib package."
            find /tmp/bonelib-ref -maxdepth 3 -type f
            exit 1
          fi
          cp "$BONELIB_DLL" NullRatRose/refs/BoneLib.dll
          echo "Prepared BoneLib compile reference: $BONELIB_DLL"


      - name: Inject private bridge secret for this build
        env:
          ROSE_BRIDGE_SECRET: ${{ secrets.ROSE_BRIDGE_SECRET }}
        shell: bash
        run: |
          if [ -z "$ROSE_BRIDGE_SECRET" ]; then
            echo "::error::Add ROSE_BRIDGE_SECRET under Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("NullRatRose/NullRatRoseMod.cs")
          source = path.read_text(encoding="utf-8")
          marker = 'private const string SharedSecret = "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET";'
          if marker not in source:
              raise SystemExit("Secret placeholder not found; refusing to build with an unknown secret state.")
          secret = os.environ["ROSE_BRIDGE_SECRET"]
          source = source.replace(marker, "private const string SharedSecret = " + json.dumps(secret) + ";", 1)
          path.write_text(source, encoding="utf-8")
          print("Private bridge secret injected into build workspace (value not logged).")
          PY

      - name: Build mod DLL
        run: dotnet build NullRatRose/NullRatRose.csproj --configuration Release --no-restore --output "$GITHUB_WORKSPACE/build-output/Mods"

      - name: Assemble distribution ZIP
        shell: bash
        run: |
          mkdir -p package/Mods package/TikTokBridge
          cp build-output/Mods/NullRatRose.dll package/Mods/
          cp NullRatRose/TikTokBridge/requirements.txt package/TikTokBridge/
          cp NullRatRose/TikTokBridge/.env.example package/TikTokBridge/
          cp NullRatRose/TikTokBridge/tiktok_listener.py package/TikTokBridge/
          cp NullRatRose/TikTokBridge/start_windows.bat package/TikTokBridge/
          cp NullRatRose/README.md package/README.md
          cd package
          zip -qr ../NullRatRose-Quest.zip .

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: NullRatRose-Quest
          path: NullRatRose-Quest.zip
          if-no-files-found: error
          retention-days: 14
