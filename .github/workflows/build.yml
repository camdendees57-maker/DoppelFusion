name: Build Doppel Fusion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    - name: Create refs folder and download DLLs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path refs | Out-Null
        # MelonLoader + Harmony + Interop
        Invoke-WebRequest -Uri "https://github.com/LavaGang/MelonLoader/releases/download/v0.6.6/MelonLoader.x64.zip" -OutFile ml.zip
        Expand-Archive ml.zip -DestinationPath ml -Force
        Copy-Item ml/MelonLoader/net6/MelonLoader.dll refs/
        Copy-Item ml/MelonLoader/net6/0Harmony.dll refs/
        Copy-Item ml/MelonLoader/net6/Il2CppInterop.Runtime.dll refs/
        Copy-Item ml/MelonLoader/net6/Il2CppInterop.Common.dll refs/
        # BoneLib from Thunderstore
        Invoke-WebRequest -Uri "https://thunderstore.io/package/download/bonelib/BoneLib/3.2.2/" -OutFile bonelib.zip
        Expand-Archive bonelib.zip -DestinationPath bl -Force
        Get-ChildItem -Path bl -Recurse -Filter BoneLib.dll | Select-Object -First 1 | Copy-Item -Destination refs/
        # LabFusion
        Invoke-WebRequest -Uri "https://github.com/Lakatrazz/BONELAB-Fusion/releases/latest/download/LabFusion.dll" -OutFile refs/LabFusion.dll
        # Game assemblies via NuGet
        dotnet add package Bonelab.GameLibs.Steam --version 6.0.0 --package-directory pkgs
        $pkgPath = Get-ChildItem -Path pkgs -Recurse -Filter Assembly-CSharp.dll | Select-Object -First 1
        if ($pkgPath) {
          Get-ChildItem -Path $pkgPath.Directory -Filter *.dll | Copy-Item -Destination refs/
        }
    - name: Restore and Build
      run: dotnet build DoppelFusion.csproj -c Release
    - name: List output
      shell: pwsh
      run: Get-ChildItem -Path bin -Recurse -Filter *.dll | Select-Object FullName
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoppelFusion
        path: |
          bin/Release/*.dll
          bin/Release/net6.0/*.dll
