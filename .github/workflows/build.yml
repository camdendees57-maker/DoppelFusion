name: Build Doppel Fusion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    - name: Restore and Build
      run: dotnet build DoppelFusion.csproj -c Release
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoppelFusion
        path: bin/Release/net6.0/DoppelFusion.dll
